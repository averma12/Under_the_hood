<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img">
<title>Chapter 9 pretraining pipeline</title>
<desc>One-time CPU prep streams FineWeb-Edu, keeps text, tokenizes with GPT-2 plus end-of-text, and packs uint16 shards onto a Modal volume. Each training step reads random windows through memmap, copies them to the GPU, runs 16 bf16 micro-batches, takes an AdamW step, and periodically evaluates and checkpoints.</desc>
<style>
.th{font:500 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font:400 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.label{fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.cont{fill:none;stroke:#B4B2A9;stroke-width:.8;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="490" rx="12" fill="#FFFFFF"/>
<rect class="cont" x="20" y="20" width="640" height="112" rx="12"/>
<text class="ts label" x="36" y="36" dominant-baseline="central">One-time prep on 8 CPUs, 6.6 min</text>
<g class="teal"><rect x="40" y="52" width="135" height="56" rx="8"/><text class="th" x="107" y="70" text-anchor="middle" dominant-baseline="central">FineWeb-Edu</text><text class="ts" x="107" y="88" text-anchor="middle" dominant-baseline="central">streamed rows</text></g>
<g class="teal"><rect x="195" y="52" width="135" height="56" rx="8"/><text class="th" x="262" y="70" text-anchor="middle" dominant-baseline="central">Keep text</text><text class="ts" x="262" y="88" text-anchor="middle" dominant-baseline="central">drop metadata</text></g>
<g class="teal"><rect x="350" y="52" width="135" height="56" rx="8"/><text class="th" x="417" y="70" text-anchor="middle" dominant-baseline="central">Tokenize</text><text class="ts" x="417" y="88" text-anchor="middle" dominant-baseline="central">GPT-2 BPE + EOT</text></g>
<g class="teal"><rect x="505" y="52" width="135" height="56" rx="8"/><text class="th" x="572" y="70" text-anchor="middle" dominant-baseline="central">Pack shards</text><text class="ts" x="572" y="88" text-anchor="middle" dominant-baseline="central">uint16 files</text></g>
<line class="arr" x1="177" y1="80" x2="193" y2="80" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="80" x2="348" y2="80" marker-end="url(#arrow)"/>
<line class="arr" x1="487" y1="80" x2="503" y2="80" marker-end="url(#arrow)"/>
<path class="arr" d="M572 110 L572 146 L340 146 L340 158" marker-end="url(#arrow)"/>
<g class="gray"><rect x="240" y="160" width="200" height="56" rx="8"/><text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Modal volume</text><text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">12 shards, 2.2 GB</text></g>
<path class="arr" d="M340 218 L340 230 L107 230 L107 280" marker-end="url(#arrow)"/>
<rect class="cont" x="20" y="240" width="640" height="226" rx="12"/>
<text class="ts label" x="140" y="256" dominant-baseline="central">Every training step on one A100</text>
<g class="purple"><rect x="40" y="282" width="135" height="56" rx="8"/><text class="th" x="107" y="300" text-anchor="middle" dominant-baseline="central">Memmap reader</text><text class="ts" x="107" y="318" text-anchor="middle" dominant-baseline="central">random windows</text></g>
<g class="purple"><rect x="195" y="282" width="135" height="56" rx="8"/><text class="th" x="262" y="300" text-anchor="middle" dominant-baseline="central">Copy to GPU</text><text class="ts" x="262" y="318" text-anchor="middle" dominant-baseline="central">pinned memory</text></g>
<g class="purple"><rect x="350" y="282" width="135" height="56" rx="8"/><text class="th" x="417" y="300" text-anchor="middle" dominant-baseline="central">Fwd + bwd × 16</text><text class="ts" x="417" y="318" text-anchor="middle" dominant-baseline="central">bf16, FlashAttn</text></g>
<g class="purple"><rect x="505" y="282" width="135" height="56" rx="8"/><text class="th" x="572" y="300" text-anchor="middle" dominant-baseline="central">AdamW step</text><text class="ts" x="572" y="318" text-anchor="middle" dominant-baseline="central">262K tokens</text></g>
<line class="arr" x1="177" y1="310" x2="193" y2="310" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="310" x2="348" y2="310" marker-end="url(#arrow)"/>
<line class="arr" x1="487" y1="310" x2="503" y2="310" marker-end="url(#arrow)"/>
<path class="arr" d="M540 340 L540 358 L417 358 L417 376" marker-end="url(#arrow)"/>
<line class="arr" x1="600" y1="340" x2="600" y2="376" marker-end="url(#arrow)"/>
<g class="purple"><rect x="350" y="378" width="135" height="56" rx="8"/><text class="th" x="417" y="396" text-anchor="middle" dominant-baseline="central">Evaluate</text><text class="ts" x="417" y="414" text-anchor="middle" dominant-baseline="central">every 100 steps</text></g>
<g class="purple"><rect x="505" y="378" width="135" height="56" rx="8"/><text class="th" x="572" y="396" text-anchor="middle" dominant-baseline="central">Checkpoint</text><text class="ts" x="572" y="414" text-anchor="middle" dominant-baseline="central">at time cap</text></g>
<text class="ts label" x="60" y="406" dominant-baseline="central">↻ repeat per update</text>
</svg>
